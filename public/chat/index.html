<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chat</title><link rel="stylesheet" href="/css/app.css"></head><body><div class=chat><div class=top style="padding:15px"><h3>💬 Live Chat</h3><a class=btn href="/">Home</a></div><div id=messages class=messages></div><div style="padding:12px"><textarea id=text rows=2 placeholder="Type message..."></textarea><button onclick=send()>Send</button><button onclick=closeRoom()>Close Chat</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script>const S=supabase.createClient(STUDY_MANTRA_CONFIG.SUPABASE_URL,STUDY_MANTRA_CONFIG.SUPABASE_ANON_KEY);const room=new URLSearchParams(location.search).get('room');let user;async function init(){let q=await S.auth.getUser();user=q.data.user;if(!user||!room){location.href='/auth.html';return}load();S.channel('room-'+room).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'room_id=eq.'+room},p=>render(p.new)).subscribe()}async function load(){let {data,error}=await S.from('chat_messages').select('*').eq('room_id',room).order('created_at');if(error)return alert(error.message);messages.innerHTML='';data.forEach(render)}function render(m){let d=document.createElement('div');d.className='bubble '+(m.sender_id===user.id?'mine':'');d.innerHTML='<b>'+ (m.sender_id===user.id?'You':'Astrologer/User')+'</b><br>'+esc(m.message)+'<div class=small>'+new Date(m.created_at).toLocaleString()+'</div>';messages.appendChild(d);messages.scrollTop=messages.scrollHeight}async function send(){let v=text.value.trim();if(!v)return;let {error}=await S.from('chat_messages').insert({room_id:room,sender_id:user.id,message:v});if(error)alert(error.message);else text.value=''}async function closeRoom(){await S.from('chat_rooms').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',room);alert('Chat closed')}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init()</script></body></html>
