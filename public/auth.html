<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="card"><h2>Study Mantra</h2><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signup()">Create account</button><button onclick="login()">Login</button><p id="msg"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script>const s=supabase.createClient(STUDY_MANTRA_CONFIG.SUPABASE_URL,STUDY_MANTRA_CONFIG.SUPABASE_ANON_KEY); async function signup(){let {error}=await s.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});msg.textContent=error?error.message:'Account created. Check email if confirmation is enabled.'} async function login(){let {data,error}=await s.auth.signInWithPassword({email:email.value,password:password.value}); if(error)return msg.textContent=error.message; let p=await s.from('profiles').select('role').eq('id',data.user.id).single(); location.href='/'+(p.data?.role||'user')+'/index.html'}</script></body></html>
