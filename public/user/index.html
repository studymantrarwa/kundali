<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/panel.css"></head><body><main class="panel"><div class="top"><h2>👤 User Panel</h2><button onclick="logout()">Logout</button></div><div class="nav"><a class="btn" href="/kundli.html">Create Free Kundli</a><a class="btn" href="/chart.html">Last Chart</a></div><h3>Available Astrologers</h3><div id="list" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/panels.js"></script><script>async function init(){let u=await me();if(!u)return;let {data,error}=await SM.from('astrologers').select('*,profiles(full_name)').eq('status','approved');if(error)return list.textContent=error.message;list.innerHTML=data.map(a=>`<div class=item><h3>${esc(a.profiles?.full_name||'Astrologer')}</h3><p>${esc(a.bio)}</p><p>₹${a.price} ${a.discount_percent?`• ${a.discount_percent}% off`:''}</p><p>${a.is_online?'🟢 Online':'⚪ Offline'}</p><button onclick="chat('${a.id}')">Start Live Chat</button></div>`).join('')}async function chat(a){let u=await me();let {data,error}=await SM.from('chat_rooms').select('*').eq('user_id',u.id).eq('astrologer_id',a).eq('status','active').maybeSingle();if(!data){let r=await SM.from('chat_rooms').insert({user_id:u.id,astrologer_id:a}).select().single();if(r.error)return alert(r.error.message);data=r.data}location.href='/chat/index.html?room='+data.id}init()</script></body></html>
