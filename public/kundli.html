<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Kundli</title><link rel="stylesheet" href="/css/app.css"></head><body><div class=card><h2>🔱 Free Kundli</h2><input id=date type=date><input id=time type=time><input id=place placeholder="Birth place">
<script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_BROWSER_KEY&libraries=places&callback=initPlaces"></script><input id=lat type=number step=any placeholder="Latitude"><input id=lng type=number step=any placeholder="Longitude"><input id=tz placeholder="Timezone e.g. Asia/Kolkata"><button onclick=calc()>Calculate</button><pre id=out></pre></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script>function initPlaces(){if(!window.google)return;const ac=new google.maps.places.Autocomplete(place,{types:['geocode']});ac.addListener('place_changed',()=>{const p=ac.getPlace();if(p.geometry){lat.value=p.geometry.location.lat();lng.value=p.geometry.location.lng();place.value=p.formatted_address||place.value}})} async function calc(){out.textContent='Calculating...';let r=await fetch('/api/calculate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:date.value,time:time.value,lat:Number(lat.value),lon:Number(lng.value),timezone:tz.value||'Asia/Kolkata'})});let j=await r.json();if(!r.ok)return out.textContent=j.error||'Error';localStorage.setItem('studyMantraLastKundli',JSON.stringify(j));out.textContent=JSON.stringify(j,null,2)+'\\n\\nOpen graphical chart: /chart.html'}</script></body></html>
