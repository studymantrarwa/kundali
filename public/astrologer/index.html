<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrologer</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/panel.css"></head><body><main class=panel><div class=top><h2>🔮 Astrologer Panel</h2><button onclick=logout()>Logout</button></div><div class=card><input id=bio placeholder="Bio"><input id=languages placeholder="Languages: Hindi, English"><input id=price type=number placeholder="Base price"><input id=discount type=number placeholder="Discount %"><label><input id=online type=checkbox> Online</label><button onclick=save()>Save Profile</button><p id=status></p></div><h3>Chats</h3><div id=rooms class=grid></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/panels.js"></script><script>let U,A;async function init(){U=await me();if(!U||U.role!=='astrologer'){location.href='/auth.html';return}let q=await SM.from('astrologers').select('*').eq('id',U.id).maybeSingle();if(q.data){A=q.data;bio.value=A.bio;languages.value=(A.languages||[]).join(', ');price.value=A.price;discount.value=A.discount_percent;online.checked=A.is_online}loadRooms()}async function save(){let v={id:U.id,bio:bio.value,languages:languages.value.split(',').map(x=>x.trim()).filter(Boolean),price:Number(price.value||0),discount_percent:Number(discount.value||0),is_online:online.checked,status:A?.status||'pending'};let {error}=await SM.from('astrologers').upsert(v);status.textContent=error?error.message:'Saved. Approval status: '+(A?.status||'pending')}async function loadRooms(){let {data}=await SM.from('chat_rooms').select('*,profiles!chat_rooms_user_id_fkey(full_name,email)').eq('astrologer_id',U.id).order('created_at',{ascending:false});rooms.innerHTML=(data||[]).map(r=>`<div class=item><b>${esc(r.profiles?.full_name||r.profiles?.email)}</b><p>${r.status}</p><a class=btn href="/chat/index.html?room=${r.id}">Open Chat</a></div>`).join('')}init()</script></body></html>
