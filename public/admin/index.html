<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/panel.css"></head><body><main class=panel><div class=top><h2>🛡️ Admin Panel</h2><button onclick=logout()>Logout</button></div><h3>Astrologer approvals</h3><div id=list class=grid></div><h3>Users</h3><div id=users class=grid></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/panels.js"></script><script>let U;async function init(){U=await me();if(!U||U.role!=='admin'){location.href='/auth.html';return}loadA();loadU()}async function loadA(){let {data}=await SM.from('astrologers').select('*,profiles(full_name,email)').order('created_at',{ascending:false});list.innerHTML=(data||[]).map(a=>`<div class=item><b>${esc(a.profiles?.full_name||a.profiles?.email)}</b><p>Status: ${a.status}</p><p>Price ₹${a.price} • Discount ${a.discount_percent}%</p><button class=ok onclick="setStatus('${a.id}','approved')">Approve</button><button class=warn onclick="setStatus('${a.id}','suspended')">Suspend</button><button class=danger onclick="setStatus('${a.id}','rejected')">Reject</button></div>`).join('')}async function setStatus(id,status){let {error}=await SM.from('astrologers').update({status}).eq('id',id);if(error)alert(error.message);loadA()}async function loadU(){let {data}=await SM.from('profiles').select('*').order('created_at',{ascending:false});users.innerHTML=(data||[]).map(x=>`<div class=item>${esc(x.full_name||x.email)}<br><span class=small>${x.role}</span></div>`).join('')}init()</script></body></html>
