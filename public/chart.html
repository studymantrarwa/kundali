<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundli Chart</title><link rel="stylesheet" href="/css/app.css"></head><body><div class=card><h2>📜 D1 / Rashi Chart</h2><div id=chart class=grid></div><h2>D9 / Navamsa</h2><div id=d9 class=grid></div></div><script>let d=JSON.parse(localStorage.getItem('studyMantraLastKundli')||'null');if(!d){chart.innerHTML='<p>No Kundli found. Calculate first.</p>'}else{function draw(el,x){el.innerHTML=(x||[]).map(h=>`<div class=item><b>House ${h.house??''}</b><p>${h.sign_name||h.sign||''}</p><p>${(h.planets||[]).map(p=>p.name||p).join(', ')}</p></div>`).join('')}draw(chart,d.houses);draw(d9,d.d9?.houses)}</script></body></html>
